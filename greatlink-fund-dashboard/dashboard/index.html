<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreatLink Fund Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2430; --muted: #5c6675;
    --line: #dde2e9; --accent: #0f5132; --accent-ink: #ffffff;
    --pos: #0a7a3d; --neg: #b3261e; --warn-bg: #fff4e0; --warn-ink: #7a4b00;
    --sample-bg: #e8f0fe; --sample-ink: #1a4a9c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 16px 24px; }
  header h1 { margin: 0 0 2px; font-size: 20px; }
  header .meta { color: var(--muted); font-size: 12.5px; }
  .banner { padding: 10px 24px; font-size: 13px; }
  .banner.sample { background: var(--sample-bg); color: var(--sample-ink); }
  .banner.stale { background: var(--warn-bg); color: var(--warn-ink); }
  main { padding: 16px 24px 80px; max-width: 1400px; margin: 0 auto; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .controls input[type=search], .controls select {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
    font: inherit; color: inherit; }
  .controls input[type=search] { min-width: 260px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .toggle input { accent-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border: none;
    padding: 8px 16px; border-radius: 6px; font: inherit; cursor: pointer; }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: none; border: 1px solid var(--line); padding: 7px 12px;
    border-radius: 6px; font: inherit; cursor: pointer; color: var(--ink); }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th.name, td.name { text-align: left; }
  thead th { position: sticky; top: 0; background: var(--panel); font-size: 12px;
    text-transform: uppercase; letter-spacing: .03em; color: var(--muted); cursor: pointer; }
  thead th.nosort { cursor: default; }
  tbody tr:hover { background: #f0f4f2; }
  td.name { white-space: normal; min-width: 220px; font-weight: 600; cursor: pointer; }
  td .cat { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .na { color: var(--muted); }
  .internal-col { background: #fbf7ef; }
  body.client-view .internal-col, body.client-view .internal-only { display: none; }
  tr.detail-row td { background: #fafbfc; text-align: left; white-space: normal; }
  .detail { display: flex; flex-wrap: wrap; gap: 24px; padding: 6px 4px; }
  .detail table { min-width: 0; width: auto; }
  .detail h4 { margin: 0 0 6px; font-size: 13px; }
  .detail .facts div { margin-bottom: 3px; }
  .muted { color: var(--muted); }
  #compareSection { margin-top: 24px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 16px 20px; }
  #compareSection h2 { margin: 0 0 4px; font-size: 17px; }
  #compareSection .basis { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  #compareTable th, #compareTable td { text-align: right; }
  #compareTable th:first-child, #compareTable td:first-child { text-align: left; }
  footer.disclaimer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-top: 1px solid var(--line); padding: 8px 24px; font-size: 11.5px; color: var(--muted); }
  @media print {
    body { background: #fff; }
    body.printing-compare header, body.printing-compare .banner, body.printing-compare .controls,
    body.printing-compare .tablewrap, body.printing-compare footer.disclaimer .hide-print,
    body.printing-compare #compareSection .no-print { display: none !important; }
    footer.disclaimer { position: static; border: none; padding: 12px 0 0; }
    #compareSection { border: none; padding: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>GreatLink Fund Dashboard</h1>
  <div class="meta" id="metaLine"></div>
</header>
<div id="sampleBanner" class="banner sample" hidden>
  ⚠️ <strong>SAMPLE DATA</strong> — placeholder figures for layout only, not real fund performance.
  Run <code>npm run discover</code>, <code>npm run scrape</code> and <code>npm run factsheets</code> to load live data.
</div>
<div id="staleBanner" class="banner stale" hidden></div>

<main>
  <div class="controls">
    <input type="search" id="search" placeholder="Search funds…">
    <select id="categoryFilter"><option value="">All categories</option></select>
    <label class="toggle"><input type="checkbox" id="clientView"> Client view (hide internal columns)</label>
    <label class="toggle"><input type="checkbox" id="compareMode"> Compare mode</label>
    <button class="primary" id="compareBtn" disabled hidden>Compare selected</button>
    <span class="muted" id="countLine"></span>
  </div>

  <div class="tablewrap">
    <table id="fundTable">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <section id="compareSection" hidden>
    <h2>Fund comparison</h2>
    <div class="basis" id="compareBasis"></div>
    <div class="tablewrap"><table id="compareTable"></table></div>
    <p style="margin:12px 0 0" class="no-print">
      <button class="primary" id="printBtn">Print / save as PDF</button>
      <button class="ghost" id="closeCompare">Close comparison</button>
    </p>
    <p class="muted" id="comparePrintDisclaimer" style="font-size:11.5px"></p>
  </section>
</main>

<footer class="disclaimer">
  <span id="disclaimerText"></span>
</footer>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var DATA = window.FUND_DATA;
  if (!DATA || !DATA.funds) {
    document.body.innerHTML = '<p style="padding:24px">data.js missing or invalid — run the scraper (npm run scrape).</p>';
    return;
  }
  var STALE_DAYS = 45;
  var DISCLAIMER =
    'Past performance is not necessarily indicative of future performance. Returns are calculated on a ' +
    (DATA.disclaimerBasis || 'bid-to-bid, dividends and distributions reinvested') + ' basis, in the fund currency. ' +
    'Figures over 1 year are annualised. This dashboard presents factual fund information only; it contains no ' +
    'ratings or recommendations and is not financial advice. Investments in ILP sub-funds are subject to investment ' +
    'risks, including possible loss of the principal amount invested. Data source: Great Eastern ILP Fund Centre / Morningstar.';

  // ---------- columns ----------
  var COLS = [
    { key: 'select',   label: '',            sortable: false, compareOnly: false, internal: false, render: selCell },
    { key: 'name',     label: 'Fund',        cls: 'name', sortVal: function (f) { return f.name || ''; }, render: nameCell },
    { key: 'bid',      label: 'Bid price',   sortVal: function (f) { return f.price && f.price.bid; }, render: function (f) { return fmtNum(f.price && f.price.bid, 4); } },
    { key: 'asOf',     label: 'As of',       sortVal: function (f) { return f.price && f.price.asOf || ''; }, render: function (f) { return esc(f.price && f.price.asOf || '—'); } },
    { key: 'ytd',      label: 'YTD %',       ret: 'ytd' },
    { key: 'y1',       label: '1Y %',        ret: 'y1' },
    { key: 'y3',       label: '3Y % p.a.',   ret: 'y3' },
    { key: 'y5',       label: '5Y % p.a.',   ret: 'y5' },
    { key: 'y10',      label: '10Y % p.a.',  ret: 'y10' },
    { key: 'si',       label: 'SI % p.a.',   ret: 'sinceInception' },
    { key: 'fee',      label: 'Mgmt fee %',  internal: true, sortVal: function (f) { return f.managementFeePct; }, render: function (f) { return fmtNum(f.managementFeePct, 2); } },
    { key: 'size',     label: 'Fund size (M)', internal: true, sortVal: function (f) { return f.fundSizeM; }, render: function (f) { return fmtNum(f.fundSizeM, 0); } },
    { key: 'risk',     label: 'Risk grade',  internal: true, sortVal: function (f) { return f.riskGrade || ''; }, render: function (f) { return esc(f.riskGrade || '—'); } },
    { key: 'notes',    label: 'Internal notes', internal: true, sortable: false, render: function (f) { return '<span class="muted">' + esc(f.internalNotes || '') + '</span>'; } }
  ];
  COLS.forEach(function (c) {
    if (c.ret) {
      c.sortVal = function (f) { return f.returns ? f.returns[c.ret] : null; };
      c.render = function (f) { return fmtPct(f.returns ? f.returns[c.ret] : null); };
    }
  });

  // ---------- state ----------
  var state = { search: '', category: '', sortKey: 'name', sortDir: 1, compare: false, selected: {}, openDetail: null };

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtNum(v, dp) { return (v == null || isNaN(v)) ? '<span class="na">n/a</span>' : Number(v).toFixed(dp); }
  function fmtPct(v) {
    if (v == null || isNaN(v)) return '<span class="na">n/a</span>';
    var cls = v > 0 ? 'pos' : v < 0 ? 'neg' : '';
    return '<span class="' + cls + '">' + (v > 0 ? '+' : '') + Number(v).toFixed(2) + '</span>';
  }
  function selCell(f) {
    if (!state.compare) return '';
    var ck = state.selected[f.id] ? ' checked' : '';
    var dis = !state.selected[f.id] && selCount() >= 5 ? ' disabled' : '';
    return '<input type="checkbox" data-sel="' + esc(f.id) + '"' + ck + dis + '>';
  }
  function nameCell(f) {
    return esc(f.name) + '<span class="cat">' + esc(f.category || '') + '</span>';
  }
  function selCount() { return Object.keys(state.selected).length; }
  function visibleFunds() {
    var q = state.search.toLowerCase();
    return DATA.funds.filter(function (f) {
      if (state.category && f.category !== state.category) return false;
      if (q && (f.name || '').toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) {
      var col = COLS.find(function (c) { return c.key === state.sortKey; });
      if (!col || !col.sortVal) return 0;
      var va = col.sortVal(a), vb = col.sortVal(b);
      if (va == null && vb == null) return 0;
      if (va == null) return 1;          // n/a always sorts last
      if (vb == null) return -1;
      return (va < vb ? -1 : va > vb ? 1 : 0) * state.sortDir;
    });
  }
  function factSheetLink(f) {
    // Prefer the local PDF (works offline); fall back to the online copy so
    // the dashboard still works if shared without the factsheets folder.
    var links = [];
    if (f.factSheetLocal) links.push('<a href="../' + esc(f.factSheetLocal) + '" target="_blank">Open Fact Sheet (local)</a>');
    if (f.factSheetUrl) links.push('<a href="' + esc(f.factSheetUrl) + '" target="_blank" rel="noopener">' + (f.factSheetLocal ? 'online copy' : 'Open Fact Sheet (online)') + '</a>');
    return links.length ? links.join(' · ') : '<span class="na">No fact sheet available</span>';
  }

  // ---------- render ----------
  function renderHead() {
    var tr = document.getElementById('headRow');
    tr.innerHTML = COLS.map(function (c) {
      if (c.key === 'select' && !state.compare) return '';
      var cls = [];
      if (c.internal) cls.push('internal-col');
      if (c.sortable === false) cls.push('nosort');
      if (c.cls) cls.push(c.cls);
      var arrow = state.sortKey === c.key ? (state.sortDir > 0 ? ' ▲' : ' ▼') : '';
      return '<th class="' + cls.join(' ') + '" data-col="' + c.key + '">' + esc(c.label) + arrow + '</th>';
    }).join('');
  }
  function renderBody() {
    var funds = visibleFunds();
    var tbody = document.getElementById('tbody');
    var html = funds.map(function (f) {
      var cells = COLS.map(function (c) {
        if (c.key === 'select' && !state.compare) return '';
        var cls = (c.internal ? 'internal-col ' : '') + (c.cls || '');
        return '<td class="' + cls + '" data-col="' + c.key + '">' + c.render(f) + '</td>';
      }).join('');
      var row = '<tr data-id="' + esc(f.id) + '">' + cells + '</tr>';
      if (state.openDetail === f.id) row += detailRow(f);
      return row;
    }).join('');
    tbody.innerHTML = html || '<tr><td colspan="' + COLS.length + '">No funds match.</td></tr>';
    document.getElementById('countLine').textContent = funds.length + ' of ' + DATA.funds.length + ' funds';
    document.getElementById('compareBtn').disabled = selCount() < 2;
    document.getElementById('compareBtn').textContent = 'Compare selected (' + selCount() + ')';
  }
  function detailRow(f) {
    var cy = f.calendarYearReturns || {};
    var years = Object.keys(cy).sort().reverse();
    var cyTable = years.length
      ? '<table><thead><tr>' + years.map(function (y) { return '<th>' + y + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody><tr>' + years.map(function (y) { return '<td>' + fmtPct(cy[y]) + '</td>'; }).join('') + '</tr></tbody></table>'
      : '<span class="na">No calendar-year data</span>';
    var span = state.compare ? COLS.length : COLS.length - 1;
    return '<tr class="detail-row"><td colspan="' + span + '"><div class="detail">' +
      '<div class="facts"><h4>Fund facts</h4>' +
        '<div>Inception: ' + esc(f.inceptionDate || '—') + '</div>' +
        '<div>Currency: ' + esc(f.currency || '—') + '</div>' +
        '<div>ISIN: ' + esc(f.isin || '—') + '</div>' +
        '<div class="internal-only">Fund size: ' + (f.fundSizeM != null ? Number(f.fundSizeM).toFixed(0) + 'M' : '—') + '</div>' +
        '<div>' + factSheetLink(f) + '</div></div>' +
      '<div><h4>Calendar-year returns (%)</h4>' + cyTable + '</div>' +
      '</div></td></tr>';
  }
  function renderBanners() {
    document.getElementById('metaLine').textContent =
      'Data generated ' + (DATA.generatedAt || 'unknown') + ' · Source: ' + (DATA.source || 'unknown');
    document.getElementById('sampleBanner').hidden = !DATA.sample;
    var newest = DATA.funds.reduce(function (acc, f) {
      var d = f.price && f.price.asOf ? new Date(f.price.asOf) : null;
      return d && !isNaN(d) && (!acc || d > acc) ? d : acc;
    }, null);
    var stale = document.getElementById('staleBanner');
    if (newest) {
      var age = Math.floor((Date.now() - newest.getTime()) / 86400000);
      if (age > STALE_DAYS) {
        stale.hidden = false;
        stale.textContent = '⚠️ Data freshness warning: the most recent price in this dataset is ' + age +
          ' days old (' + newest.toISOString().slice(0, 10) + '). Re-run the scraper before using this with clients.';
      } else stale.hidden = true;
    }
    document.getElementById('disclaimerText').textContent = DISCLAIMER;
  }
  function renderCompare() {
    var sec = document.getElementById('compareSection');
    var ids = Object.keys(state.selected);
    if (ids.length < 2) { sec.hidden = true; return; }
    var funds = DATA.funds.filter(function (f) { return state.selected[f.id]; });
    var rows = [
      ['Category', function (f) { return esc(f.category || '—'); }],
      ['Bid price', function (f) { return fmtNum(f.price && f.price.bid, 4); }],
      ['Price as of', function (f) { return esc(f.price && f.price.asOf || '—'); }],
      ['YTD %', function (f) { return fmtPct(f.returns.ytd); }],
      ['1Y %', function (f) { return fmtPct(f.returns.y1); }],
      ['3Y % p.a.', function (f) { return fmtPct(f.returns.y3); }],
      ['5Y % p.a.', function (f) { return fmtPct(f.returns.y5); }],
      ['10Y % p.a.', function (f) { return fmtPct(f.returns.y10); }],
      ['Since inception % p.a.', function (f) { return fmtPct(f.returns.sinceInception); }],
      ['Inception date', function (f) { return esc(f.inceptionDate || '—'); }]
    ];
    var allYears = {};
    funds.forEach(function (f) { Object.keys(f.calendarYearReturns || {}).forEach(function (y) { allYears[y] = 1; }); });
    Object.keys(allYears).sort().reverse().forEach(function (y) {
      rows.push([y + ' return %', function (f) { return fmtPct((f.calendarYearReturns || {})[y]); }]);
    });
    if (!document.body.classList.contains('client-view')) {
      rows.push(['Mgmt fee % (internal)', function (f) { return fmtNum(f.managementFeePct, 2); }]);
      rows.push(['Risk grade (internal)', function (f) { return esc(f.riskGrade || '—'); }]);
    }
    var t = document.getElementById('compareTable');
    t.innerHTML = '<thead><tr><th></th>' + funds.map(function (f) { return '<th>' + esc(f.name) + '</th>'; }).join('') + '</tr></thead>' +
      '<tbody>' + rows.map(function (r) {
        return '<tr><td>' + r[0] + '</td>' + funds.map(function (f) { return '<td>' + r[1](f) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody>';
    document.getElementById('compareBasis').textContent =
      'Comparing ' + funds.length + ' funds · figures as generated ' + (DATA.generatedAt || '');
    document.getElementById('comparePrintDisclaimer').textContent = DISCLAIMER;
    sec.hidden = false;
    sec.scrollIntoView({ behavior: 'smooth' });
  }
  function renderAll() { renderHead(); renderBody(); renderBanners(); }

  // ---------- events ----------
  document.getElementById('search').addEventListener('input', function (e) { state.search = e.target.value; renderBody(); });
  document.getElementById('categoryFilter').addEventListener('change', function (e) { state.category = e.target.value; renderBody(); });
  document.getElementById('clientView').addEventListener('change', function (e) {
    document.body.classList.toggle('client-view', e.target.checked);
    if (!document.getElementById('compareSection').hidden) renderCompare();
  });
  document.getElementById('compareMode').addEventListener('change', function (e) {
    state.compare = e.target.checked;
    document.getElementById('compareBtn').hidden = !state.compare;
    if (!state.compare) { state.selected = {}; document.getElementById('compareSection').hidden = true; }
    renderAll();
  });
  document.getElementById('compareBtn').addEventListener('click', renderCompare);
  document.getElementById('closeCompare').addEventListener('click', function () {
    document.getElementById('compareSection').hidden = true;
  });
  document.getElementById('printBtn').addEventListener('click', function () {
    document.body.classList.add('printing-compare');
    window.print();
    document.body.classList.remove('printing-compare');
  });
  document.getElementById('headRow').addEventListener('click', function (e) {
    var th = e.target.closest('th');
    if (!th || th.classList.contains('nosort')) return;
    var key = th.dataset.col;
    var col = COLS.find(function (c) { return c.key === key; });
    if (!col || col.sortable === false || !col.sortVal) return;
    if (state.sortKey === key) state.sortDir *= -1; else { state.sortKey = key; state.sortDir = 1; }
    renderHead(); renderBody();
  });
  document.getElementById('tbody').addEventListener('click', function (e) {
    var sel = e.target.closest('input[data-sel]');
    if (sel) {
      var id = sel.dataset.sel;
      if (state.selected[id]) delete state.selected[id];
      else if (selCount() < 5) state.selected[id] = true;
      renderBody();
      return;
    }
    var nameTd = e.target.closest('td[data-col=name]');
    if (nameTd) {
      var id2 = nameTd.parentElement.dataset.id;
      state.openDetail = state.openDetail === id2 ? null : id2;
      renderBody();
    }
  });

  // ---------- init ----------
  var cats = {};
  DATA.funds.forEach(function (f) { if (f.category) cats[f.category] = 1; });
  var catSel = document.getElementById('categoryFilter');
  Object.keys(cats).sort().forEach(function (c) {
    var o = document.createElement('option'); o.value = c; o.textContent = c; catSel.appendChild(o);
  });
  renderAll();
})();
</script>
</body>
</html>
