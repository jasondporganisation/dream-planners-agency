# Unit tests for the GreatLink fund dashboard (greatlink-funds/) on every pull
# request that touches it. Offline: the tests use saved fixtures in
# greatlink-funds/tests/fixtures/ and never call the Great Eastern sites.
# (The weekly refresh workflow runs the same tests before and after refreshing.)

name: GreatLink tests

on:
  pull_request:
    paths:
      - "greatlink-funds/**"
      - ".github/workflows/greatlink-*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: greatlink-funds
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4   # runs the dashboard sort/filter tests
        with:
          node-version: "20"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.31" "pdfplumber>=0.11"

      - name: Unit tests (parsers, sanity checks, report format, dashboard logic)
        run: python -m unittest discover tests -v
